{{define "EditarDisciplinas"}}
{{template "_head"}}
{{template "_menu"}}
<body>
    <div class="container">
            <div class="jumbotron jumbotron-fluid">
                <div class="container">
                    <h1 class="display-5">Editar Disciplina</h1>
                    <p class="lead">Insira os dados para atualizar/editar</p>
                </div>
            </div>
            <form method="POST" action="/disciplinas/atualizar">
                <input type="hidden" name="id" value="{{.Id}}">
                <div class="row">
                    <div class="col-sm-8">
                        <div class="form-group">
                            <label for="nome">Nome:</label>
                            <input type="text" name="nome" class="form-control" value="{{.Nome}}">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-8">
                        <div class="form-group">
                            <label for="descricao">Descrição:</label>
                            <input type="text" name="descricao" class="form-control" value="{{.Descricao}}">
                        </div>
                    </div>
                </div>
                <button type="submit" value="salvar" class="btn btn-success">Salvar</button>
                <a class="btn btn-info" href="/">Voltar</a>
            </form>
    </div>
</body>
</html>
{{end}}
