{{define "DisciplinasIndex"}}
{{template "_head"}}
{{template "_menu"}}

<body>
    <div class="container">
        <section class="card">
            <div>
                <table class="table table-striped table-hover mb-0">                
                    <thead>
                        <tr>
                            <th>Id da Disciplina</th>
                            <th>Nome da Matricula</th>
                            <th>Descrição</th>
                            <th>Editar</th>
                            <th>Deletar</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{range .}}
                        <tr>
                            <td>{{.Id}}</td>
                            <td>{{.Nome}}</td>
                            <td>{{.Descricao}}</td>
                            <td><a href="/disciplinas/editar?id={{.Id}}" class="btn btn-info">Editar</a></td>
                            <td><button onclick="onDelete('{{.Id}}')" class="btn btn-danger">Deletar</button></td>
                        </tr>
                        {{end}}
                    </tbody>
                </table>
            </div>
        </section>
        <div class="card-footer">
            <a href="/disciplinas/adicionar" class="btn btn-primary mb-2">Adicionar Disciplina</a>
            <a href="/alunos" class="btn btn-primary mb-2">Ver Alunos</a>
            <a href="/matriculas" class="btn btn-primary mb-2">Ver Matriculas</a>
        </div>
    </div>
</body>
<script>
    function onDelete(id){
        let resposta = confirm("Tem certeza que deseja deletar essa disciplina?")
        if (resposta){
            window.location = "/disciplinas/deletar?id=" + id
        }
    }
</script>
</html>
{{end}}
