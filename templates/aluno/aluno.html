{{define "AlunosIndex"}}
{{template "_head"}}
{{template "_menu"}}

<body>
    <div class="container">
        <section class="card">
            <div>
                <table class="table table-striped table-hover mb-0">                
                    <thead>
                        <tr>
                            <th>Id do Aluno</th>
                            <th>Nome do Aluno</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{range .}}
                        <tr>
                            <td>{{.Id}}</td>
                            <td>{{.Nome}}</td>
                            <td>{{.Email}}</td>
                            <td><a href="/alunos/editar?id={{.Id}}" class="btn btn-info">Editar</a></td>
                            <td><button onclick="onDelete('{{.Id}}')" class="btn btn-danger">Deletar</button></td>
                        </tr>
                        {{end}}
                    </tbody>
                </table>
            </div>
        </section>
        <div class="card-footer">
            <a href="/alunos/adicionar" class="btn btn-primary mb-2">Adicionar Aluno</a>
            <a href="/disciplinas" class="btn btn-primary mb-2">Ver Disciplinas</a>
            <a href="/matriculas" class="btn btn-primary mb-2">Ver Matriculas</a>
        </div>
    </div>
</body>
<script>
    function onDelete(id){
        let resposta = confirm("Tem certeza que deseja deletar esse aluno?")
        if (resposta){
            window.location = "/alunos/deletar?id=" + id
        }
    }
</script>
</html>
{{end}}
